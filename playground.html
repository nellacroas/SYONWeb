<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYON Live Converter — Real-Time .syon to JSON</title>
  <link rel="stylesheet" href="site-header.css">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-soft: #e0f2fe;
      --pane-bg: #1e1e1e;
      --pane-head: #181818;
      --pane-border: #2b2b2b;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--pane-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      color: #d4d4d4;
    }

    .pane-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--pane-border);
      background: var(--pane-head);
    }

    .pane-head .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9cdcfe;
      margin-right: auto;
    }

    .pane-head--source {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    }

    .pane-head--source .title {
      margin-right: 0;
      justify-self: start;
    }

    .pane-head--source .preset-nav {
      justify-self: center;
    }

    .pane-head--source #clear {
      justify-self: end;
    }

    select, button {
      appearance: none;
      border: 1px solid #3c3c3c;
      background: #252526;
      color: #d4d4d4;
      padding: 5px 10px;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    select:hover, button:hover {
      border-color: #555555;
      background: #2d2d2d;
    }

    .preset-nav {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .preset-nav select {
      min-width: 0;
      max-width: 100%;
    }

    .preset-step {
      width: 29px;
      height: 29px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-size: 15px;
      line-height: 1;
    }

    button:disabled,
    button:disabled:hover {
      border-color: #3c3c3c;
      background: #252526;
      color: #6b7280;
      cursor: default;
    }

    #editor-host {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #source {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      border: 0;
      outline: 0;
      padding: 16px;
      background: transparent;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 14px;
      line-height: 1.62;
      white-space: pre;
      overflow: auto;
    }

    .output-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #1e1e1e;
    }

    #output {
      margin: 0;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      line-height: 1.58;
      color: #d4d4d4;
      white-space: pre;
    }

    #output .json-key { color: #9cdcfe; }
    #output .json-string { color: #ce9178; }
    #output .json-number { color: #b5cea8; }
    #output .json-bool { color: #569cd6; font-weight: 600; }
    #output .json-null { color: #569cd6; font-style: italic; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-top: 1px solid var(--pane-border);
      color: #9ca3af;
      font-size: 12px;
      background: #181818;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex: 0 0 auto;
    }
    .dot.ok { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14); }
    .dot.err { background: #f87171; box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.14); }

    #error {
      display: none;
      padding: 12px 14px;
      border-top: 1px solid #5b252b;
      background: #3a171b;
      color: #ffd6d6;
      font-size: 13px;
      line-height: 1.5;
    }

    #error.visible { display: block; }
    #error .code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-weight: 700;
      color: #fca5a5;
    }
    #error .where {
      color: #f3b4b4;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    #error .related {
      margin-top: 4px;
      color: #d9a3a3;
      font-size: 12px;
    }

    footer {
      padding: 8px 20px 10px;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 1fr) minmax(260px, 1fr);
      }
    }

    @media (max-width: 600px) {
      .pane-head--source {
        display: flex;
        flex-wrap: wrap;
      }

      .pane-head--source .title {
        flex: 1 0 100%;
      }

      .pane-head--source .preset-nav {
        width: 100%;
      }

      .pane-head--source .preset-nav select {
        flex: 1 1 auto;
      }

      .pane-head--source #clear {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <img src="syon-logo.svg" width="28" height="28" alt="">
        <span>SYON</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="playground.html" class="active" aria-current="page">Live Converter</a>
        <a href="spec.html">Specification</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="pane" aria-label="SYON Source">
      <div class="pane-head pane-head--source">
        <span class="title">SYON Source (.syon)</span>
        <div class="preset-nav">
          <button id="prev-preset" type="button" class="preset-step" aria-label="Previous tutorial or example" title="Previous topic" disabled>&larr;</button>
          <select id="preset-select" aria-label="Load tutorial or example">
            <optgroup label="Tutorials — start here">
              <option value="tutorial-values" selected>1. Values &amp; Strings</option>
              <option value="tutorial-objects">2. Objects &amp; Headings</option>
              <option value="tutorial-arrays">3. Named Arrays &amp; Objects</option>
              <option value="tutorial-tables">4. Tables &amp; Missing Records</option>
              <option value="tutorial-sections">5. Sections &amp; Safe Additions</option>
            </optgroup>
            <optgroup label="Advanced tutorials">
              <option value="tutorial-paths">6. Paths &amp; Quoted Names</option>
              <option value="tutorial-advanced">7. Advanced Tables &amp; Flattening</option>
              <option value="tutorial-root-arrays">8. Root Arrays &amp; Objects</option>
              <option value="tutorial-json-root">9. JSON Root &amp; Sections</option>
            </optgroup>
            <optgroup label="Examples">
              <option value="app">Sample: App &amp; Tables</option>
              <option value="jsonpatch">Sample: JSON + Sections (---)</option>
              <option value="comments">Sample: Inline Object Comments</option>
              <option value="routes">Sample: Grouped Tables (***)</option>
            </optgroup>
          </select>
          <button id="next-preset" type="button" class="preset-step" aria-label="Next tutorial or example" title="Next topic">&rarr;</button>
        </div>
        <button id="clear" type="button">Clear</button>
      </div>
      <div id="editor-host">
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </section>

    <section class="pane" aria-label="JSON output">
      <div class="pane-head">
        <span class="title">JSON Output</span>
        <button id="copy" type="button">Copy JSON</button>
      </div>
      <div class="output-wrap">
        <pre id="output"></pre>
      </div>
      <div id="error" role="alert"></div>
    </section>
  </main>

  <footer>
    <span>Real-time SYON &rarr; JSON conversion. Hover over red underlines for error details.</span>
    <span>Ctrl/Cmd + Enter converts manually</span>
  </footer>

  <script src="converter.js"></script>
  <script src="editor.bundle.js"></script>
  <script>
    (function () {
      "use strict";

      const editorHost = document.getElementById("editor-host");
      const fallbackSource = document.getElementById("source");
      const output = document.getElementById("output");
      const errorBox = document.getElementById("error");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const presetSelect = document.getElementById("preset-select");

      const previousPresetButton = document.getElementById("prev-preset");
      const nextPresetButton = document.getElementById("next-preset");
      const clearButton = document.getElementById("clear");
      const copyButton = document.getElementById("copy");

      const presets = {
        "tutorial-values": [
          "// 1. Values and strings",
          "// SYON stores data as names and values, not formatted text.",
          "// The right pane shows JSON: another text notation for the same data.",
          "// Lines starting with // are explanations, not part of the data.",
          "// Write a field as name: value. Text (a string) needs quotes.",
          'service: "demo"',
          "retries: 3",
          "enabled: true // true and false mean yes and no.",
          'note: null // null means no value, not the text "null".',
          "",
          '// Double quotes understand escapes: \\n means a line break.',
          'greeting: "Hello!\\nWelcome."',
          "",
          "// Single quotes keep text literal, including backslashes.",
          "folder: 'C:\\data'",
          "",
          "// > introduces one string that spans several lines.",
          "// One space after > is ignored; the line breaks stay.",
          "message: >",
          '>"Deployment started.',
          "> Checking services.",
          '> Deployment complete."',
          "",
          "// --- More about keys ---",
          "",
          "// A bare key uses only ASCII letters, digits, _ and -.",
          "// Bare keys are case-sensitive: Name and name are different keys.",
          'point-3: "valid: hyphen after the first character"',
          '_private: "valid: underscore inside a bare key"',
          'Name: "bare key"',
          'name: "a different key"',
          "",
          "// Anything else must be quoted.",
          '"_": "quoted, so the reserved single underscore is allowed"',
          '"display name": "space needs quotes"',
          '"With.Dot": "dot needs quotes"',
          '"-point3": "leading hyphen needs quotes"'
        ].join("\n"),

        "tutorial-objects": [
          "// 2. Objects and headings",
          "// An object groups named fields, like a record or a form.",
          "// # app selects a top-level object called app.",
          "# app",
          'name: "demo"',
          "",
          "// ## selects an object inside app. Indentation is optional.",
          "## database",
          'host: "localhost"',
          "port: 5432",
          "",
          "// ### creates an object one level deeper than ##, and so on.",
          "### replicas",
          "count: 2",
          "",
          "// A single # selects another object at the top level.",
          "# display",
          'theme: "dark"',
          "",
          "// An inline object groups fields directly between { and }.",
          "// Separate fields with commas. This is the JSON literal form.",
          "// Field names are quoted here; SYON also allows bare names.",
          'window: {"width": 800, "height": 600}',
          "",
          "// display now contains theme and a window object with two fields."
        ].join("\n"),

        "tutorial-arrays": [
          "// 3. Named arrays and objects",
          "// An array is an ordered list. field[+]: value appends one item.",
          "x[+]: 12",
          "x[+]: 13",
          "",
          "// Inline object append: x[+] : { ... } adds one object item.",
          'x[+] : {"retry": 3, "safe": true}',
          "",
          "// name[] opens a named list; the following + rows append to it.",
          "y[]",
          "+ 14",
          "+ 15",
          "",
          "// An inline array of objects uses [ { ... }, { ... } ].",
          "// Separate objects with commas; each object is one list item.",
          'people: [',
          '  {"name": "Ada"},',
          '  {"name": "Lin"}, //trailing comma is allowed after the last item',
		  ']',
          "",
          "// # services[+] appends an object to services and selects it.",
          "// The fields below belong to this new object, not the top level.",
          "# services[+]",
          'name: "web"',
          "",
          "// Named lists work inside the selected object too.",
          "ports[]",
          "+ 8080",
          "+ 8443",
          "",
          "// Repeat the heading to append and select a separate object.",
          "# services[+]",
          'name: "worker"',
          "// An inline list uses [ ]; separate multiple items with commas.",
          "ports: [9000, 9001]",
          "// You can still use ## to select inside the object",
          "## params",
		  "enable: true"
        ].join("\n"),

        "tutorial-tables": [
          "// 4. Tables and missing records",
          "// A table is a shorter way to write a list of similar objects.",
          "// users[] opens the list; * declares the column names (the schema).",
          "users[]",
          "* name  | role     | active",
          '+ "Ada" | "admin"  | true',
          "// Each + row creates an object using those field names.",
          '+ "Lin" | "member" | false',
          "",
          "// + ~ adds one null list item instead of an object.",
          "// Use it to preserve a missing record's place in the list.",
          "+ ~",
          "",
          '+ "Sam" | "member" | true',
          '+ "Jo"  | "member" | true'
        ].join("\n"),

        "tutorial-sections": [
          "// 5. Sections and safe additions",
          "# app",
          'name: "demo"',
          'tags: ["core"]',
          "",
          "// --- resets the heading cursor to the top level.",
          "// It keeps the existing data: this is NOT a separate document.",
          "---",
          "# app",
          "enabled: true",
          "",
          "// A later section can add an item to an existing list.",
          "// field[+]: value appends without opening a list block.",
          'tags[+]: "public"',
          "",
          "// Fields cannot be assigned twice, even across sections.",
          "// Uncomment the next line to see an error, not an overwrite.",
          '// name: "another name"',
          '// tags: ["private"]'
        ].join("\n"),

        "tutorial-paths": [
          "// 6. Advanced: paths and quoted names",
          "// A dot between names means a field inside another object.",
          "// app.database.host is host inside database inside app.",
          'app.database.host: "localhost"',
          "app.database.port: 5432",
          "",
          "// Quote a segment to keep its dot as part of the name.",
          '// Here "public.api" is one name, not two nested objects.',
          'services."public.api".port: 8080',
          "",
          "// A ## heading is relative to the current # frame and can also use a path.",
          "# app",
		  'name: "Hi Syon"',
          "## database.replica",
          'mode: "read"',
          "",
          "// The same paths work in headings; fields below use that object.",
          "# app.database",
          "pool: 8",
          "",
          '# services."public.api"',
          "enabled: true",
          "",
          "// Quoting the whole heading makes it one literal name.",
          '// This is separate from app.database above: the dot is inside quotes.',
          '# "app.database"',
          'note: "One name containing a dot"'
        ].join("\n"),

        "tutorial-advanced": [
          "// 7. Advanced: table groups, keyed entries, and flattening",
          "// Earlier tables made lists. * $ makes an object with named entries.",
          "# services",
          "// $ marks the entry's name; columns after : describe its fields.",
          "* $         : image     | port",
          '- web       : "app:1"   | 8080',
          "// services.web is an object containing image and port.",
          "",
          "// In row 2, ^ locks image to the first row's value: app:1.",
          "// Every later row in this group must keep ^ in that column.",
          "- worker    : ^         | 9000",
          "- scheduler : ^         | 9001",
          "",
          "// *** starts a fresh group without changing the table or columns.",
          "***",
          '- cache     : "redis:7" | 6379',
          "// This group's row 2 can declare its own lock pattern.",
          "- replica   : ^         | 6380",
          "// If row 2 has no ^, later rows in that group cannot introduce it.",
          "",
          "// With no named columns, * $ maps each name directly to one value.",
          "# notices",
          "* $",
          '- web    : "Maintenance starts at 02:00 UTC."',
          "// Here ^ copies the whole message, following the same row-2 rule.",
          "- email  : ^",
          "- mobile : ^",
          "",
          "// Flattening writes nested objects as flat table rows.",
          "# export",
          "users[]",
          "// contact.email means an email field inside a contact object.",
          "* id | name  | contact.email",
          '+ 1  | "Ada" | "ada@example.com"',
          "// _ leaves the field absent, rather than setting it to null.",
          "// With no contact fields written, Lin has no contact object at all.",
          '+ 2  | "Lin" | _',
          "// As in tutorial 4, + ~ adds a null list item: a missing record.",
          "+ ~"
        ].join("\n"),

        "tutorial-root-arrays": [
          "// 8. Advanced: root arrays and objects",
          "// Usually a document contains named fields, as in tutorial 3.",
          "// # [] instead makes the whole document itself an ordered list.",
          "# []",
          "",
          "// + appends one complete value. Here it is an object literal.",
          "// Its ports field contains an inline list.",
          '+ {"name": "cache", "ports": [6379]}',
          "",
          "// # [+] appends an object directly to the document's root list.",
          "// Unlike # services[+], there is no named services field.",
          "# [+]",
          'name: "web"',
          "",
          "// Once an object is selected, write fields and named lists normally.",
          "ports[]",
          "+ 8080",
          "+ 8443",
          "",
          "// Another # [+] appends and selects a separate root-list object.",
          "# [+]",
          'name: "worker"',
          "ports: [9000]"
        ].join("\n"),

        "tutorial-json-root": [
          "// 9. Advanced: JSON as the root, plus sections",
          "// SYON accepts JSON directly, adding features like comments and sections.",
          "// Here { ... } is the whole document, not a field inside another object.",
          "// A bare root value must come before any headings, writes, or ---.",
          "{",
          '  "name": "demo",',
          '  "server": {"host": "localhost"},',
          '  "tags": ["core"]',
          "}",
          "",
          "// A completed object or array literal is sealed for this section.",
          "// Uncomment to see why additions need a new section first (E_SEALED).",
          "// enabled: true",
          "",
          "// --- resets the heading cursor and clears section-local seals.",
          "// It keeps the same data AND remembers every earlier assignment.",
          "---",
          "// New fields and list items can now be added to the existing root.",
          "enabled: true",
          'tags[+]: "public"',
          "",
          "// No redefinition: existing fields cannot be assigned again, even equally.",
          "// Uncomment either line to see a duplicate-assignment error.",
          '// name: "demo"',
          '// tags: ["private"]',
          "",
          "// A second bare literal after --- cannot replace the root (E_ROOT).",
          '// {"replacement": true}',
          "",
          "// Existing objects can gain new fields, but cannot overwrite old ones.",
          "# server",
          "port: 8080",
          '// host: "other-host" // Invalid: host was assigned in the JSON literal.'
        ].join("\n"),

        app: [
          "# application",
          'name: "edge-gateway"',
          "_env: 'production'",
          'tags[+]: "eu-west"',
          'tags[+]: "tier-1"',
          "",
          'database.host: "db.internal"',
          "",
          "## database",
          "pool: 8",
          "timeout: 30",
          "",
          "### replicas[+]",
          'region: "eu-west-1"',
          "readOnly: true",
          "",
          "### replicas[+]",
          'region: "eu-central-1"',
          "readOnly: false",
          "",
          "# endpoints",
          "* $       : method | path       | rateLimit",
          '- health  : "GET"  | "/health"  | _',
          '- metrics : ^      | "/metrics" | 120',
          "***",
          '- charge  : "POST" | "/charge"  | 60',
          "",
          "# jobs",
          "queue[]",
          "* name    | workers | enabled",
          '+ "build" | 4       | true',
          '+ "test"  | ^       | false',
          '+ "lint"  | ^       | true',
          "",
          "---",
          "// New section: reopen & extend earlier nodes",
          "# application",
          'tags[+]: "v2-rollout"',
          "database.ssl: true"
        ].join("\n"),

        jsonpatch: [
          "{",
          '  "service": "checkout-api",',
          '  "settings": { "timeout": 30 },',
          '  "origins": ["https://shop.example.com"]',
          "}",
          "---",
          "// Section 2: extend the JSON root in a new section:",
          "settings.retries: 3",
          'origins[+]: "https://admin.example.com"',
          "",
          "# settings.tls",
          "enabled: true",
          'minVersion: "TLSv1.3"',
          "",
          "---",
          "// Section 3: add rollout metadata & extra origins",
          'origins[+]: "https://pay.example.com"',
          'settings.tls.alpn[+]: "h2"'
        ].join("\n"),

        comments: [
          "# gateway",
          "upstream: {",
          '  url: "https://internal.service:8443", // inline comment inside object!',
          "  // Connection pool settings",
          "  pool: {",
          "    maxIdle: 16,",
          "    keepAliveMs: 30000,",
          "  },",
          "  tags: [",
          '    "core", // primary tier',
          '    "pci-scope",',
          "  ]",
          "}"
        ].join("\n"),

        routes: [
          "Network.Route[]",
          "* name        | port | tls   | enabled | description",
          '+ "primary"   | 443  | true  | true    | "Main server"',
          '+ "backup"    | ^    | ^     | false   | "Failover"',
          '+ "secondary" | ^    | ^     | true    | _',
          "***",
          '+ "legacy"    | 80   | false | true    | "HTTP only"',
          '+ "legacy-2"  | ^    | ^     | false   | _'
        ].join("\n")
      };

      const initialSource = presets[presetSelect.value];
      let timer = null;
      let editor = null;
      let rawJsonText = "";

      function setStatus(kind, text) {
        statusDot.className = "dot" + (kind ? " " + kind : "");
        statusText.textContent = text;
      }

      function clearError() {
        errorBox.className = "";
        errorBox.textContent = "";
      }

      function showError(error, inputLines) {
        clearError();
        errorBox.className = "visible";

        const code = document.createElement("div");
        code.className = "code";
        code.textContent = error.code;

        const message = document.createElement("div");
        message.textContent = error.message;

        const where = document.createElement("div");
        where.className = "where";
        where.textContent = "line " + error.line + ", column " + error.col;

        errorBox.appendChild(code);
        errorBox.appendChild(message);
        errorBox.appendChild(where);

        if (error.related && error.related.line) {
          const related = document.createElement("div");
          related.className = "related";
          related.textContent = "Related location: line " + error.related.line +
            (error.related.col ? ", column " + error.related.col : "");
          errorBox.appendChild(related);
        }

        if (inputLines && inputLines[error.line - 1]) {
          const snippet = document.createElement("div");
          snippet.className = "related";
          snippet.textContent = "> " + inputLines[error.line - 1];
          errorBox.appendChild(snippet);
        }
      }

      function getSourceText() {
        return editor ? editor.getValue() : fallbackSource.value;
      }

      function setSourceText(text) {
        if (editor) {
          editor.setValue(text);
        } else {
          fallbackSource.value = text;
        }
      }

      function focusEditor() {
        if (editor) editor.focus();
        else fallbackSource.focus();
      }

      function updatePresetButtons() {
        const options = Array.from(presetSelect.options);
        const index = options.findIndex(function (option) {
          return option.value === presetSelect.value;
        });
        const previous = index > 0 ? options[index - 1] : null;
        const next = index >= 0 && index < options.length - 1 ? options[index + 1] : null;

        previousPresetButton.disabled = !previous;
        nextPresetButton.disabled = !next;
        previousPresetButton.title = previous ? "Previous: " + previous.textContent : "Previous topic";
        nextPresetButton.title = next ? "Next: " + next.textContent : "Next topic";
        previousPresetButton.setAttribute(
          "aria-label",
          previous ? "Previous: " + previous.textContent : "Previous tutorial or example"
        );
        nextPresetButton.setAttribute(
          "aria-label",
          next ? "Next: " + next.textContent : "Next tutorial or example"
        );
      }

      function loadPreset(key) {
        if (!presets[key]) return;
        setSourceText(presets[key]);
        convert();
        focusEditor();
        updatePresetButtons();
      }

      function stepPreset(offset) {
        const options = Array.from(presetSelect.options);
        const index = options.findIndex(function (option) {
          return option.value === presetSelect.value;
        });
        const target = index >= 0 ? options[index + offset] : null;
        if (!target) return;
        presetSelect.value = target.value;
        loadPreset(target.value);
      }

      function renderJson(json) {
        rawJsonText = json || "";
        if (window.BareEditor && window.BareEditor.highlightJsonHtml) {
          output.innerHTML = window.BareEditor.highlightJsonHtml(rawJsonText);
        } else {
          output.textContent = rawJsonText;
        }
      }

      function convert() {
        const text = getSourceText();
        const result = BareConverter.convertSource(text);
        const inputLines = text.split("\n");

        if (result.ok) {
          renderJson(result.json);
          clearError();
          setStatus("ok", "Converted");
        } else {
          renderJson("");
          showError(result.error, inputLines);
          setStatus("err", result.error.code);
        }
      }

      function scheduleConvert() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(convert, 120);
      }

      if (window.BareEditor && window.BareEditor.createBareEditor) {
        fallbackSource.remove();
        editor = window.BareEditor.createBareEditor({
          parent: editorHost,
          initialDoc: initialSource,
          onChange: scheduleConvert,
          onConvertShortcut: convert
        });
      } else {
        fallbackSource.value = initialSource;
        fallbackSource.addEventListener("input", scheduleConvert);
      }

      presetSelect.addEventListener("change", function () {
        loadPreset(presetSelect.value);
      });
      previousPresetButton.addEventListener("click", function () {
        stepPreset(-1);
      });
      nextPresetButton.addEventListener("click", function () {
        stepPreset(1);
      });
      clearButton.addEventListener("click", function () {
        setSourceText("");
        renderJson("");
        clearError();
        setStatus("", "Ready");
        focusEditor();
      });
      copyButton.addEventListener("click", function () {
        const text = rawJsonText;
        if (!text) return;
        const done = function () {
          copyButton.textContent = "Copied";
          setTimeout(function () { copyButton.textContent = "Copy JSON"; }, 900);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {});
        }
      });

      updatePresetButtons();
      convert();
    })();
  </script>
</body>
</html>
