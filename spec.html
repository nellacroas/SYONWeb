<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYON V0.1 Specification — Synthesized Object Notation</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-soft: #e0f2fe;
      --code-bg: #1e1e1e;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.68;
    }

    /* Top Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .navbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 8px;
      transition: background 120ms ease, color 120ms ease;
    }

    .nav-links a:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .nav-links a.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Spec Layout */
    .spec-layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 72px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
    }

    .toc-sidebar {
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      padding-right: 8px;
    }

    .toc-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      margin: 0 0 10px 10px;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toc-list a {
      display: block;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13.5px;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background 100ms ease, color 100ms ease;
    }

    .toc-list a:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .toc-list a.toc-h3 {
      padding-left: 22px;
      font-size: 12.5px;
    }

    /* Markdown Article Styling */
    .spec-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 48px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      min-width: 0;
    }

    .spec-content h1 {
      margin-top: 0;
      font-size: 34px;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .spec-content h2 {
      margin-top: 44px;
      margin-bottom: 14px;
      font-size: 24px;
      letter-spacing: -0.015em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 80px;
    }

    .spec-content h3 {
      margin-top: 28px;
      margin-bottom: 10px;
      font-size: 18px;
      scroll-margin-top: 80px;
    }

    .spec-content h4 {
      margin-top: 22px;
      margin-bottom: 8px;
      font-size: 15px;
      color: var(--text-muted);
    }

    .spec-content hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .spec-content code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
      background: var(--surface-alt);
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid #e2e8f0;
    }

    .spec-content pre {
      background: var(--code-bg);
      color: #d4d4d4;
      padding: 16px 18px;
      border-radius: 10px;
      overflow-x: auto;
      line-height: 1.56;
      margin: 16px 0;
    }

    .spec-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border: 0;
      font-size: 13.5px;
    }

    .spec-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 14px;
    }

    .spec-content th, .spec-content td {
      border: 1px solid var(--border);
      padding: 9px 13px;
      text-align: left;
    }

    .spec-content th {
      background: var(--surface-alt);
      font-weight: 700;
    }

    /* VS Code Dark+ Syntax Tokens inside code blocks */
    .json-key, .syon-propertyName { color: #9cdcfe; }
    .json-string, .syon-string { color: #ce9178; }
    .json-number, .syon-number { color: #b5cea8; }
    .json-bool, .syon-bool { color: #569cd6; font-weight: 600; }
    .json-null, .syon-null { color: #569cd6; font-style: italic; }
    .syon-heading { color: #4fc1ff; font-weight: 700; }
    .syon-modifier, .syon-meta { color: #dcdcaa; font-weight: 600; }
    .syon-keyword, .syon-contentSeparator { color: #c586c0; font-weight: 700; }
    .syon-operator { color: #d4d4d4; font-weight: 700; }
    .syon-atom { color: #4ec9b0; font-weight: 700; }
    .syon-comment { color: #6a9955; font-style: italic; }
    .syon-punctuation { color: #808080; }
    .syon-brace { color: #ffd700; }

    @media (max-width: 920px) {
      .spec-layout {
        grid-template-columns: 1fr;
      }
      .toc-sidebar {
        position: static;
        max-height: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .spec-content {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <span>SYON</span>
        <span class="brand-badge">.syon</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="playground.html">Live Converter</a>
        <a href="spec.html" class="active">Specification</a>
      </div>
    </div>
  </nav>

  <div class="spec-layout">
    <aside class="toc-sidebar" aria-label="Table of Contents">
      <div class="toc-title">On this page</div>
      <ul id="toc" class="toc-list"></ul>
    </aside>

    <article id="spec-body" class="spec-content">
      <p>Loading specification…</p>
    </article>
  </div>

  <script src="editor.bundle.js"></script>
  <script src="spec.bundle.js"></script>
  <script>
    (function () {
      "use strict";

      const specBody = document.getElementById("spec-body");
      const tocList = document.getElementById("toc");

      function slugify(text) {
        return String(text)
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }

      function renderMarkdown(mdText) {
        if (window.marked && window.marked.parse) {
          specBody.innerHTML = window.marked.parse(mdText);
        } else {
          specBody.textContent = mdText;
          return;
        }

        // Build TOC from h2 and h3
        tocList.innerHTML = "";
        const headings = specBody.querySelectorAll("h2, h3");
        const usedIds = new Set();

        headings.forEach(function (h) {
          const text = h.textContent.trim();
          if (text === "Contents") return;
          let id = slugify(text) || "section";
          let counter = 2;
          while (usedIds.has(id)) {
            id = slugify(text) + "-" + counter++;
          }
          usedIds.add(id);
          h.id = id;

          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#" + id;
          a.textContent = text;
          if (h.tagName === "H3") a.className = "toc-h3";
          li.appendChild(a);
          tocList.appendChild(li);
        });

        // Syntax-highlight code blocks
        if (window.BareEditor) {
          specBody.querySelectorAll("pre code").forEach(function (codeEl) {
            const cls = codeEl.className || "";
            const raw = codeEl.textContent;
            if (cls.includes("language-syon") || cls.includes("language-md")) {
              codeEl.innerHTML = window.BareEditor.highlightSyonHtml(raw);
            } else if (cls.includes("language-json")) {
              codeEl.innerHTML = window.BareEditor.highlightJsonHtml(raw);
            }
          });
        }
      }

      // Fetch SYON_v0.1.md when served over HTTP(S), or fall back to bundled SYON_SPEC_MD on file://
      fetch("./SYON_v0.1.md")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(renderMarkdown)
        .catch(function () {
          if (window.SYON_SPEC_MD) {
            renderMarkdown(window.SYON_SPEC_MD);
          } else {
            specBody.textContent = "Could not load SYON_v0.1.md.";
          }
        });
    })();
  </script>
</body>
</html>
